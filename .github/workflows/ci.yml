name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      DATABASE_URL: postgresql://reminders:ci_password@127.0.0.1:5432/reminders?serverVersion=16&charset=utf8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reminders
          POSTGRES_USER: reminders
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reminders -d reminders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, xml, dom
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP formatting
        run: composer lint:cs

      - name: Run PHPStan
        run: composer lint:types

      - name: Create and migrate test database
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run tests
        run: php bin/phpunit